<form class="add-form" [formGroup]="form" (ngSubmit)="submit()">
  <h2>Add Medicine</h2>

  <div class="form-grid">
    <label class="field">
      <span>Full Name *</span>
      <input type="text" formControlName="fullName" placeholder="e.g. Paracetamol 500mg" />
      <small class="error" *ngIf="f['fullName'].touched && f['fullName'].invalid">Full name is required.</small>
    </label>

    <label class="field">
      <span>Brand *</span>
      <input type="text" formControlName="brand" placeholder="e.g. Calpol" />
      <small class="error" *ngIf="f['brand'].touched && f['brand'].invalid">Brand is required.</small>
    </label>

    <label class="field">
      <span>Expiry Date *</span>
      <input type="date" formControlName="expiryDate" />
      <small class="error" *ngIf="f['expiryDate'].touched && f['expiryDate'].invalid">Expiry date is required.</small>
    </label>

    <label class="field">
      <span>Quantity *</span>
      <input type="number" min="0" formControlName="quantity" />
      <small class="error" *ngIf="f['quantity'].touched && f['quantity'].invalid">Quantity must be 0 or more.</small>
    </label>

    <label class="field">
      <span>Price (₹) *</span>
      <input type="number" min="0" step="0.01" formControlName="price" />
      <small class="error" *ngIf="f['price'].touched && f['price'].invalid">Price must be 0 or more.</small>
    </label>

    <label class="field field-wide">
      <span>Notes</span>
      <textarea formControlName="notes" rows="2" placeholder="Optional notes"></textarea>
    </label>
  </div>

  <div class="form-actions">
    <button type="submit" [disabled]="isSubmitting">
      {{ isSubmitting ? 'Saving…' : 'Add Medicine' }}
    </button>
    <span class="error" *ngIf="errorMessage">{{ errorMessage }}</span>
  </div>
</form>
